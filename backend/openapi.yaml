    Payment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        consultation:
          type: integer
          readOnly: true
          nullable: true
        amount:
          type: integer
          readOnly: true
          description: Amount in whole units of currency
        currency:
          type: string
          readOnly: true
        method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
        gateway_order_id:
          type: string
          readOnly: true
          nullable: true
        transaction_id:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - consultation
      - created_at
      - currency
      - gateway_order_id
      - id
      - method
      - status
      - transaction_id
    PaymentMethodEnum:
      enum:
      - upi
      - card
      - netbanking
      - wallet
      type: string
      description: |-
        * `upi` - UPI
        * `card` - Card
        * `netbanking` - Netbanking
        * `wallet` - Wallet
    PaymentOrderRequest:
      type: object
      properties:
        appointment_id:
          type: integer
          minimum: 1
        method:
          $ref: '#/components/schemas/PaymentOrderRequestMethodEnum'
      required:
      - appointment_id
      - method
    PaymentOrderRequestMethodEnum:
      enum:
      - card
      - upi
      type: string
      description: |-
        * `card` - Card
        * `upi` - UPI
    PaymentStatusEnum:
      enum:
      - pending
      - success
      - failed
      - refunded
      type: string
      description: |-
        * `pending` - Pending
        * `success` - Success
        * `failed` - Failed
        * `refunded` - Refunded
    PaymentVerification:
      type: object
      properties:
        payment_id:
          type: integer
          minimum: 1
          description: Local payment id from the order API
        razorpay_payment_id:
          type: string
          maxLength: 100
        razorpay_signature:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
      required:
      - payment_id
      - razorpay_payment_id
      - razorpay_signature
    PlatformEnum:
      enum:
      - android
      - ios
      - web
      type: string
      description: |-
        * `android` - Android
        * `ios` - iOS
        * `web` - Web
    PreferredLanguageEnum:
      enum:
      - en
      - hi
      type: string
      description: |-
        * `en` - English
        * `hi` - हिन्दी
    PrescriptionItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        medicine_name:
          type: string
          maxLength: 200
        dosage:
          type: string
          description: 'For example: 1 tablet, 10 ml'
          maxLength: 100
        timings:
          type: array
          items:
            $ref: '#/components/schemas/TimingsEnum'
          maxItems: 4
          minItems: 1
        timing_labels:
          type: array
          items:
            type: string
          readOnly: true
        food_relation:
          $ref: '#/components/schemas/FoodRelationEnum'
        food_relation_label:
          type: string
          readOnly: true
        duration_days:
          type: integer
          maximum: 365
          minimum: 1
        instructions:
          type: string
          maxLength: 500
      required:
      - dosage
      - duration_days
      - food_relation
      - food_relation_label
      - id
      - medicine_name
      - timing_labels
      - timings
    Pricing:
      type: object
      properties:
        country_code:
          type: string
          description: Country whose prices are shown. Send this as country_code in
            booking step 1.
        country_name:
          type: string
        detected_country_code:
          type: string
          nullable: true
          description: Country found from the location or query; null if none
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          description: |-
            default = location unknown or that country has no pricing yet, so India prices are shown

            * `location` - location
            * `country` - country
            * `default` - default
        is_fallback:
          type: boolean
        currency:
          type: string
          description: ISO 4217, e.g. INR, USD
        currency_symbol:
          type: string
        general_fee:
          type: integer
          description: General physician consultation fee, whole currency units
        general_fee_display:
          type: string
          description: e.g. "₹200", "$10", "AED 40"
        doctor_share_percent:
          type: integer
        platform_fee_percent:
          type: integer
        general_doctor_payout:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        general_doctor_payout_display:
          type: string
        specialist_fee_min:
          type: integer
        specialist_fee_max:
          type: integer
        specialist_fee_step:
          type: integer
        specialist_fee_range_display:
          type: string
      required:
      - country_code
      - country_name
      - currency
      - currency_symbol
      - detected_country_code
      - doctor_share_percent
      - general_doctor_payout
      - general_doctor_payout_display
      - general_fee
      - general_fee_display
      - is_fallback
      - platform_fee_percent
      - source
      - specialist_fee_max
      - specialist_fee_min
      - specialist_fee_range_display
      - specialist_fee_step
    ProfilePhotoUpload:
      type: object
      properties:
        photo:
          type: string
          format: uri
          description: PNG or JPG, up to 5 MB.
      required:
      - photo
    RecordDoctor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Display name, for example "Dr. Ananya Sharma"
        specialization:
          type: string
      required:
      - id
      - name
      - specialization
    RecordPatient:
      type: object
      properties:
        name:
          type: string
        age:
          type: integer
          nullable: true
        gender:
          type: string
        relation:
          type: string
          description: '"self" or a family relation such as spouse, son'
        relation_label:
          type: string
          description: '"You", "Spouse", "Son" ...'
        is_self:
          type: boolean
        family_member_id:
          type: integer
          nullable: true
      required:
      - age
      - family_member_id
      - gender
      - is_self
      - name
      - relation
      - relation_label
    RelationEnum:
      enum:
      - spouse
      - son
      - daughter
      - father
      - mother
      - brother
      - sister
      - grandfather
      - grandmother
      - other
      type: string
      description: |-
        * `spouse` - Spouse
        * `son` - Son
        * `daughter` - Daughter
        * `father` - Father
        * `mother` - Mother
        * `brother` - Brother
        * `sister` - Sister
        * `grandfather` - Grandfather
        * `grandmother` - Grandmother
        * `other` - Other
    RoleEnum:
      enum:
      - patient
      - doctor
      - admin
      type: string
      description: |-
        * `patient` - Patient
        * `doctor` - Doctor
        * `admin` - Admin
    SlotDate:
      type: object
      properties:
        date:
          type: string
          format: date
        day_label:
          type: string
          description: '"Today" or a short weekday such as "Mon"'
        day_number:
          type: integer
        available_slot_count:
          type: integer
      required:
      - available_slot_count
      - date
      - day_label
      - day_number
    SourceEnum:
      enum:
      - location
      - country
      - default
      type: string
      description: |-
        * `location` - location
        * `country` - country
        * `default` - default
    Speciality:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          description: e.g. Dermatology
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        short_name:
          type: string
          readOnly: true
          description: Compact label, e.g. Derma
        title:
          type: string
          readOnly: true
          description: Consultation title shown on cards, e.g. "Skin Consultation"
        description:
          type: string
          readOnly: true
        fee:
          type: integer
          readOnly: true
          description: INR rupees per consultation (all countries)
        currency:
          type: string
          readOnly: true
        fee_display:
          type: string
          readOnly: true
          description: e.g. "₹400"
      required:
      - currency
      - description
      - fee
      - fee_display
      - id
      - name
      - short_name
      - slug
      - title
    SupportContacts:
      type: object
      properties:
        phone:
          type: string
        phone_display:
          type: string
        phone_link:
          type: string
          description: 'tel: link to open the dialer'
        email:
          type: string
          format: email
        email_link:
          type: string
          description: 'mailto: link to open the mail app'
      required:
      - email
      - email_link
      - phone
      - phone_display
      - phone_link
    TimingsEnum:
      enum:
      - morning
      - afternoon
      - evening
      - night
      type: string
      description: |-
        * `morning` - Morning
        * `afternoon` - Afternoon
        * `evening` - Evening
        * `night` - Night
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TrackerStep:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/KeyEnum'
        label:
          type: string
        done:
          type: boolean
        at:
          type: string
          format: date-time
          nullable: true
      required:
      - at
      - done
      - key
      - label
    TreatmentSystemsEnum:
      enum:
      - allopathy
      - homeopathy
      - ayurveda
      - unani
      - home_remedy
      type: string
      description: |-
        * `allopathy` - Allopathic
        * `homeopathy` - Homeopathic
        * `ayurveda` - Ayurvedic
        * `unani` - Unani
        * `home_remedy` - Home Remedy
    UnreadCount:
      type: object
      properties:
        unread_count:
          type: integer
      required:
      - unread_count
    UpcomingAppointment:
      type: object
      properties:
        appointment_id:
          type: integer
        consultation_id:
          type: integer
        title:
          type: string
          description: '"General Consultation", "Skin Consultation", ...'
        patient_name:
          type: string
        doctor_name:
          type: string
          nullable: true
          description: null while a doctor is being matched
        doctor_specialization:
          type: string
          nullable: true
        starts_at:
          type: string
          format: date-time
        day:
          type: string
          description: Date badge day, e.g. "18"
        month:
          type: string
          description: Date badge month, e.g. "OCT"
        time:
          type: string
          description: e.g. "10:00 AM"
        mode:
          type: string
        mode_label:
          type: string
          description: Always "Online"
        status:
          type: string
          description: finding_doctor or confirmed
        status_label:
          type: string
      required:
      - appointment_id
      - consultation_id
      - day
      - doctor_name
      - doctor_specialization
      - mode
      - mode_label
      - month
      - patient_name
      - starts_at
      - status
      - status_label
      - time
      - title
    VerifiedIdentity:
      type: object
      properties:
        kind:
          allOf:
          - $ref: '#/components/schemas/VerifiedIdentityKindEnum'
          readOnly: true
        value:
          type: string
          readOnly: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - kind
      - value
      - verified_at
    VerifiedIdentityKindEnum:
      enum:
      - email
      - phone
      type: string
      description: |-
        * `email` - Email
        * `phone` - Phone
    VideoSource:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/BlogVideoKindEnum'
        url:
          type: string
          format: uri
      required:
      - kind
      - url
    Error:
      description: 'Error body: `{"detail": "message"}` (JWT errors add `code`), `{"field":
        ["message"]}` for invalid fields, or `["message"]` for a general validation
        error.'
      oneOf:
      - type: object
        properties:
          detail:
            type: string
          code:
            type: string
        additionalProperties: true
      - type: array
        items:
          type: string
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
