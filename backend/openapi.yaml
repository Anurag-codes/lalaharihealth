openapi: 3.0.3
info:
  title: LalahariHealth API
  version: v1
  description: |-
    Mobile booking flow:

    1. Request and verify Gmail email OTP through /api/v1/auth/patient/email/request-otp/ and /api/v1/auth/patient/email/verify-otp/, or verify phone OTP in the app with Firebase and exchange its ID token at /api/v1/auth/patient/phone/firebase/. New verified patients are registered automatically. Use the returned access JWT as a Bearer token. Refresh through /api/v1/auth/patient/token/refresh/. Signed-in patients can link another verified contact through /api/v1/auth/patient/link/. Legacy password endpoints remain available.
    Logged-out users fill Patient Details first, then log in with phone OTP, then continue at step 2.
    2. Select Patient: GET /api/v1/patients/booking-patients/ lists Myself and family members (add one with POST /api/v1/patients/family-members/). POST /api/v1/consultations/ with family_member_id (null = Myself), mode and, for Book Specialist, speciality (id from GET /api/v1/doctors/specialities/); blank patient fields are auto-filled. A 400 listing missing fields means show the Patient Details form and send patient_name, patient_age, patient_gender and patient_phone.
    3. Symptoms: GET /api/v1/consultations/conditions/ returns disease -> type -> variant. PUT /api/v1/consultations/{id}/history/ with condition, condition_type and condition_variant (required when that level has options), condition_details, duration_value, duration_unit, ongoing_medication and treatment_details.
    4. Optional POST /api/v1/consultations/{id}/documents/ as multipart with one file per request. PDF/PNG/JPG up to 10 MB. Skip means no upload call; private downloads require authentication.
    5. Schedule Appointment: GET /api/v1/appointments/slot-dates/?days=7 for the date strip and GET /api/v1/appointments/slots/?date=YYYY-MM-DD (add speciality_id= for specialists) for 15-minute times (Asia/Kolkata, 08:00-23:59) opened by verified doctors through /api/v1/doctors/me/slots/. "Request Appointment" reserves nothing.
    6. Case Preview: GET /api/v1/consultations/{id}/preview/?slot_id=. "Submit Case": POST /api/v1/appointments/ with consultation_id, slot_id and information_confirmed=true. General fee is the country rate from the pricing table (default India INR 200) using the country_code sent in step 1; specialists always use the INR speciality fee. An appointment is reserved, not doctor-confirmed; pending reservations consume the slot.
    7. Checkout: POST /api/v1/payments/orders/ with appointment_id and method (card/upi). Use returned order id, public key, amount in minor units of the currency (paise, cents...) and currency with Razorpay mobile Checkout. Never submit card numbers, CVVs or UPI credentials to this API. Configure automatic capture in Razorpay.
    8. POST /api/v1/payments/verify/ with payment_id, razorpay_payment_id and razorpay_signature. Only gateway-confirmed captured payments succeed; signed webhooks also reconcile capture.
    9. Finding Your Doctor: poll GET /api/v1/appointments/{id}/. Status moves awaiting_payment -> finding_doctor -> confirmed when staff assign a verified doctor of that speciality. The 30-minute match is a staff target, not guaranteed. Each change also creates a notification and an FCM push.

    Location pricing: GET /api/v1/pricing/?lat=&lng= (or ?country=US) is public and returns the general physician fee for the country of the user, falling back to India INR 200 when the country has no active rate. Send its country_code in booking step 1. Appointment summary prices are whole units of the appointment currency; checkout order amounts are minor units. Payment gateway configuration is required for live checkout. Private medical files must never be served through a public /media/ alias. Use PostgreSQL for production scheduling locks.

    Profile section: GET/PATCH /api/v1/patients/profile/ (name, city, gender, date of birth, app language en/hi), PUT/DELETE /api/v1/patients/profile/photo/, family CRUD at /api/v1/patients/family-members/, Medical Records at /api/v1/patients/medical-records/ and /{id}/, and Contact Us at /api/v1/core/support-contacts/. Verified doctors write diagnosis and prescriptions through /api/v1/doctors/me/consultations/{id}/record/.

    Home screen: GET /api/v1/patients/home/ (name, photo, language, bell count, General Physician card, specialities, support number, upcoming appointments, My Cases badge). My Cases with a progress tracker: GET /api/v1/patients/cases/?status=active|closed and /{consultation_id}/. Notifications: GET /api/v1/notifications/, unread-count/, {id}/read/, read-all/; register the FCM token after login with POST /api/v1/notifications/devices/ and remove it on logout with devices/remove/.

    Conventions: JSON bodies (multipart only for file uploads). Lists are paginated as {count, next, previous, results} with ?page=. Errors use HTTP status codes with a JSON body: {"detail": "message"} or {"field": ["message"]} for validation (400). 401 = refresh the token or log in, 403 = not allowed, 404 = not found or not yours, 429 = too many requests, 503 = service not configured. Every endpoint below shows request and response examples and its error responses.
paths:
  /api/v1/appointments/:
    get:
      operationId: appointments_list
      summary: My appointments
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Mobile scheduling
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentList'
              examples:
                Example:
                  value:
                    count: 1
                    next: null
                    previous: null
                    results:
                    - id: 1
                      appointment_number: APT-00001
                      consultation: 1
                      slot: 2
                      slot_time: '2026-10-20T10:00:00+05:30'
                      schedule_date: '2026-10-20'
                      schedule_time: 10:00 AM
                      status: confirmed
                      status_label: Confirmed
                      patient_name: Rahul Sharma
                      consultation_title: General Consultation
                      speciality: null
                      chief_complaint: General Consultation
                      mode_label: Online
                      doctor: 3
                      doctor_name: Dr. Ananya Sharma
                      doctor_specialization: General Physician
                      amount: 200
                      currency: INR
                      payment_status: success
                      created_at: '2026-10-18T18:37:16+05:30'
          description: ''
        '401':
          description: Missing, invalid or expired access token. Refresh the token
            and retry, or log in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    detail: Authentication credentials were not provided.
      description: 'My appointments, newest first, paginated with `?page=`. Each has
        status, slot time, doctor and fee. Send `Authorization: Bearer <access>` (access
        JWT from login).'
    post:
      operationId: appointments_create
      description: 'Call from Case Preview after the patient ticks "I confirm the
        information provided above is correct." `information_confirmed` must be true.
        If the exact slot was just taken but another doctor is free at the same time,
        that slot is used instead. Fee is server-set: the general physician fee of
        the step 1 country_code (default INR 200), or the INR speciality fee. Repeating
        the same request returns the existing appointment. Next: create a payment
        order for the returned appointment (Checkout).'
      summary: 'Submit Case: reserve the selected slot'
      tags:
      - Mobile scheduling
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
            examples:
              SubmitCase:
                value:
                  consultation_id: 42
                  slot_id: 318
                  information_confirmed: true
                summary: Submit case
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
            examples:
              Example:
                value:
                  consultation_id: 1
                  slot_id: 1
                  information_confirmed: true
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
            examples:
              Example:
                value:
                  consultation_id: 1
                  slot_id: 1
                  information_confirmed: true
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                SameRequestRepeated:ExistingAppointment:
                  value:
                    id: 12345
                    appointment_number: APT-12345
                    consultation: 42
                    slot: 318
                    slot_time: '2026-10-18T10:00:00+05:30'
                    schedule_date: '2026-10-18'
                    schedule_time: 10:00 AM
                    status: awaiting_payment
                    status_label: Awaiting payment
                    patient_name: Rahul Sharma
                    consultation_title: General Consultation
                    speciality: null
                    chief_complaint: Headache - Cluster Headache - Chronic
                    mode_label: Online
                    doctor: null
                    doctor_name: null
                    doctor_specialization: null
                    amount: 200
                    currency: INR
                    payment_status: not_started
                    created_at: '2026-10-16T18:20:00+05:30'
                  summary: 'Same request repeated: existing appointment'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                AppointmentCreated:
                  value:
                    id: 12345
                    appointment_number: APT-12345
                    consultation: 42
                    slot: 318
                    slot_time: '2026-10-18T10:00:00+05:30'
                    schedule_date: '2026-10-18'
                    schedule_time: 10:00 AM
                    status: awaiting_payment
                    status_label: Awaiting payment
                    patient_name: Rahul Sharma
                    consultation_title: General Consultation
                    speciality: null
                    chief_complaint: Headache - Cluster Headache - Chronic
                    mode_label: Online
                    doctor: null
                    doctor_name: null
                    doctor_specialization: null
                    amount: 200
                    currency: INR
                    payment_status: not_started
                    created_at: '2026-10-16T18:20:00+05:30'
                  summary: Appointment created
          description: ''
        '400':
          description: Validation error. Body maps each invalid field to a list of
            messages, or has `detail`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    information_confirmed:
                    - Please confirm the information is correct.
        '401':
          description: Missing, invalid or expired access token. Refresh the token
            and retry, or log in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    detail: Authentication credentials were not provided.
  /api/v1/appointments/{appointment_id}/:
    get:
      operationId: appointments_retrieve
      description: 'Checkout shows `appointment_number`, `schedule_date`, `schedule_time`
        and `amount`. After payment, poll this: `finding_doctor` = payment successful
        and a doctor is being matched; `confirmed` adds `doctor_name`.'
      summary: 'Checkout / "Finding Your Doctor": appointment summary and status'
      parameters:
      - in: path
        name: appointment_id
        schema:
          type: integer
        required: true
      tags:
      - Mobile scheduling
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                FindingDoctor:
                  value:
                    id: 12345
                    appointment_number: APT-12345
                    consultation: 42
                    slot: 318
                    slot_time: '2026-10-18T10:00:00+05:30'
                    schedule_date: '2026-10-18'
                    schedule_time: 10:00 AM
                    status: finding_doctor
                    status_label: Finding doctor
                    patient_name: Rahul Sharma
                    consultation_title: General Consultation
                    speciality: null
                    chief_complaint: Headache - Cluster Headache - Chronic
                    mode_label: Online
                    doctor: null
                    doctor_name: null
                    doctor_specialization: null
                    amount: 200
                    currency: INR
                    payment_status: success
                    created_at: '2026-10-16T18:20:00+05:30'
                  summary: Finding doctor
          description: ''
        '401':
          description: Missing, invalid or expired access token. Refresh the token
            and retry, or log in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    detail: Authentication credentials were not provided.
        '404':
          description: Not found, or it does not belong to you.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    detail: No Appointment matches the given query.
  /api/v1/appointments/{appointment_id}/assign-doctor/:
    post:
      operationId: appointments_assign_doctor_create
      description: The doctor must be a general physician for general bookings, or
        of the booking's speciality with consultation_fee and currency equal to the
        fee paid. If the doctor differs from the slot's doctor, the booking moves
        to that doctor's free slot at the same time.
      summary: 'Staff only: assign a verified doctor to a paid appointment'
      parameters:
      - in: path
        name: appointment_id
        schema:
          type: integer
        required: true
      tags:
      - Staff matching
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorAssignment'
            examples:
              Assign:
                value:
                  doctor_id: 7
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DoctorAssignment'
            examples:
              Example:
                value:
                  doctor_id: 3
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DoctorAssignment'
            examples:
              Example:
                value:
                  doctor_id: 3
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                Example:
                  value:
                    id: 1
                    appointment_number: APT-00001
                    consultation: 1
                    slot: 2
                    slot_time: '2026-10-20T10:00:00+05:30'
                    schedule_date: '2026-10-20'
                    schedule_time: 10:00 AM
                    status: confirmed
                    status_label: Confirmed
                    patient_name: Rahul Sharma
                    consultation_title: General Consultation
                    speciality: null
                    chief_complaint: General Consultation
                    mode_label: Online
                    doctor: 3
                    doctor_name: Dr. Ananya Sharma
                    doctor_specialization: General Physician
                    amount: 200
                    currency: INR
                    payment_status: success
                    created_at: '2026-10-18T18:37:16+05:30'
          description: ''
        '400':
          description: Validation error. Body maps each invalid field to a list of
            messages, or has `detail`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                  - This doctor has no free slot at the appointment time.
        '401':
          description: Missing, invalid or expired access token. Refresh the token
            and retry, or log in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    detail: Authentication credentials were not provided.
        '403':
          description: Signed in, but not allowed (wrong role or account).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    detail: You do not have permission to perform this action.
        '404':
          description: Not found, or it does not belong to you.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    detail: No DoctorProfile matches the given query.
  /api/v1/appointments/slot-dates/:
    get:
      operationId: appointments_slot_dates_list
      description: Returns one entry per day starting today with the number of free
        times, so the app can grey out days with none.
      summary: 'Schedule Appointment: date strip (Today and the next days)'
      parameters:
      - in: query
        name: days
        schema:
          type: integer
          maximum: 30
          minimum: 1
          default: 7
      - in: query
        name: speciality_id
        schema:
          type: integer
          minimum: 1
        description: Speciality of the booking (Book Specialist). Omit for a general
          physician.
      tags:
      - Mobile scheduling
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlotDate'
              examples:
                DateStrip:
                  value:
                  - date: '2026-10-16'
                    day_label: Today
                    day_number: 16
                    available_slot_count: 6
                  - date: '2026-10-17'
                    day_label: Sat
                    day_number: 17
                    available_slot_count: 0
                  - date: '2026-10-18'
                    day_label: Sun
                    day_number: 18
                    available_slot_count: 24
                  summary: Date strip
          description: ''
        '400':
          description: Validation error. Body maps each invalid field to a list of
            messages, or has `detail`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    field_name:
                    - This field is required.
        '401':
          description: Missing, invalid or expired access token. Refresh the token
            and retry, or log in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    detail: Authentication credentials were not provided.
  /api/v1/appointments/slots/:
    get:
      operationId: appointments_slots_list
      description: Times are 15-minute slots opened by verified doctors from the doctor
        app, between 08:00 and 23:59 India time. Each time appears once; `remaining_capacity`
        is how many doctors are still free then. Tapping "Request Appointment" only
        opens Case Preview - nothing is reserved until "Submit Case".
      summary: 'Schedule Appointment: free time slots for a date'
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: Local India date, YYYY-MM-DD
        required: true
      - in: query
        name: speciality_id
        schema:
          type: integer
          minimum: 1
        description: Speciality of the booking (Book Specialist). Omit for a general
          physician.
      tags:
      - Mobile scheduling
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentSlot'
              examples:
                Slots:
                  value:
                  - id: 318
                    starts_at: '2026-10-18T08:00:00+05:30'
                    time_display: 08:00 AM
                    remaining_capacity: 2
                  - id: 319
                    starts_at: '2026-10-18T08:15:00+05:30'
                    time_display: 08:15 AM
                    remaining_capacity: 1
          description: ''
        '400':
          description: Validation error. Body maps each invalid field to a list of
            messages, or has `detail`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    field_name:
                    - This field is required.
        '401':
          description: Missing, invalid or expired access token. Refresh the token
            and retry, or log in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    detail: Authentication credentials were not provided.
  /api/v1/auth/patient/email/request-otp/:
    post:
      operationId: auth_patient_email_request_otp_create
      summary: Send a patient sign-in OTP by email
      tags:
      - Patient authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOtpRequest'
            examples:
              Example:
                value:
                  email: rahul.sharma@gmail.com
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailOtpRequest'
            examples:
              Example:
                value:
                  email: rahul.sharma@gmail.com
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailOtpRequest'
            examples:
              Example:
                value:
                  email: rahul.sharma@gmail.com
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailOtpResponse'
              examples:
                Example:
                  value:
                    request_id: 0988b090-3a0e-4f18-b321-b120fbbe4b0b
                    expires_in: 300
                    resend_after: 60
                    detail: Verification email sent. Use the code to continue.
          description: ''
        '400':
          description: Validation error. Body maps each invalid field to a list of
            messages, or has `detail`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    email:
                    - Enter a valid email address.
        '429':
          description: Too many requests. Wait and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    detail: Request was throttled. Expected available in 3599 seconds.
        '503':
          description: Service is not configured or temporarily unavailable on the
            server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    detail: The verification email could not be sent. Please try again
                      later.
      description: Login/sign-up step 1 (email). Sends a 6-digit OTP from our Gmail
        account to the email. Returns 202 even for new emails; nothing is created
        yet. Resend after the cooldown, otherwise 429. 503 means email sending is
        not configured on the server.
  /api/v1/auth/patient/email/verify-otp/:
    post:
      operationId: auth_patient_email_verify_otp_create
      summary: Verify email OTP and register or sign in a patient
      tags:
      - Patient authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOtpVerify'
            examples:
              Example:
                value:
                  request_id: 1063655c-3eb1-4975-8213-0934e6f5cef6
                  otp: '123456'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailOtpVerify'
            examples:
              Example:
                value:
                  request_id: 1063655c-3eb1-4975-8213-0934e6f5cef6
                  otp: '123456'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailOtpVerify'
            examples:
              Example:
                value:
                  request_id: 1063655c-3eb1-4975-8213-0934e6f5cef6
                  otp: '123456'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientAuthResponse'
              examples:
                Example:
                  value:
                    access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwidXNlcl9pZCI6MX0.access-signature
                    refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoicmVmcmVzaCIsInVzZXJfaWQiOjF9.refresh-signature
                    is_new_user: true
                    user:
                      id: 1
                      first_name: ''
                      last_name: ''
                      city: ''
                      role: patient
                      email: rahul.sharma@gmail.com
                      phone_number: ''
                      is_email_verified: true
                      is_phone_verified: false
                      identities:
                      - kind: email
                        value: rahul.sharma@gmail.com
                        verified_at: '2026-10-18T18:37:12+05:30'
          description: ''
        '400':
          description: Validation error. Body maps each invalid field to a list of
            messages, or has `detail`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    otp: Invalid or expired code. Request a new code if needed.
        '403':
          description: Signed in, but not allowed (wrong role or account).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    detail: An active patient account is required.
        '429':
          description: Too many requests. Wait and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    detail: Request was throttled. Expected available in 3599 seconds.
      description: 'Login/sign-up step 2 (email). Send the `request_id` returned by
        request-otp/ and the 6-digit OTP. A new email is registered as a patient automatically
        (`is_new_user: true`, show the name/onboarding screen); an existing patient
        is signed in (`is_new_user: false`). Store `access` (60 minutes) and `refresh`
        (7 days) securely. Too many wrong codes give 429; a non-patient account gives
        403.'
  /api/v1/auth/patient/link/email/request-otp/:
    post:
      operationId: auth_patient_link_email_request_otp_create
      summary: Send an email OTP to link to the signed-in patient
      tags:
      - Patient authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOtpRequest'
            examples:
