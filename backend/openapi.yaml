      tags:
      - Doctor schedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorAvailability'
            examples:
              From7PMToEndOfDay:
                value:
                  date: '2026-10-18'
                  start_time: '19:00'
                summary: From 7 PM to end of day
              EveningWindow:
                value:
                  date: '2026-10-18'
                  start_time: '19:00'
                  end_time: '21:00'
                summary: Evening window
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DoctorAvailability'
            examples:
              Example:
                value:
                  date: '2026-10-20'
                  start_time: '22:00'
