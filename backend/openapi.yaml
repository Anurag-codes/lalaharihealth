  /api/v1/pricing/:
    get:
      operationId: pricing_retrieve
      description: |-
        Public, no login. Send the device/browser location as `lat` and `lng` (the country is found offline on our server; coordinates are not stored), or an ISO `country` code. With neither, or when that country has no pricing yet, India prices are returned (`source: "default"`, ₹200).

        App: call on the home screen and before booking, show `general_fee_display`, and send `country_code` in `POST /api/v1/consultations/` so checkout charges this amount in this currency. Specialist (Book Specialist) bookings are always charged in INR at the speciality fee.

        For-doctors page: `specialist_fee_min/max/step` is the fee range a specialist may choose, and `general_doctor_payout_display` is what a general doctor receives after the platform fee.
      summary: General physician price for the user's location
      parameters:
      - in: query
        name: country
        schema:
          type: string
          pattern: ^[A-Za-z]{2}$
          minLength: 1
        description: ISO country code, e.g. US. Ignored when lat/lng are sent.
      - in: query
        name: lat
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
        description: Device/browser latitude
      - in: query
        name: lng
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
        description: Device/browser longitude
      tags:
      - Pricing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pricing'
              examples:
                India(locationInDelhiOrNoLocation):
                  value:
                    country_code: IN
                    country_name: India
                    detected_country_code: IN
                    source: location
                    is_fallback: false
                    currency: INR
                    currency_symbol: ₹
                    general_fee: 200
                    general_fee_display: ₹200
                    doctor_share_percent: 75
                    platform_fee_percent: 25
                    general_doctor_payout: '150.00'
                    general_doctor_payout_display: ₹150
                    specialist_fee_min: 200
                    specialist_fee_max: 2000
                    specialist_fee_step: 100
                    specialist_fee_range_display: ₹200–₹2,000
                  summary: India (location in Delhi or no location)
                UnitedStates(locationInNewYork):
                  value:
                    country_code: US
                    country_name: United States
                    detected_country_code: US
                    source: location
                    is_fallback: false
                    currency: USD
                    currency_symbol: $
                    general_fee: 10
                    general_fee_display: $10
                    doctor_share_percent: 75
                    platform_fee_percent: 25
                    general_doctor_payout: '7.50'
                    general_doctor_payout_display: $7.50
                    specialist_fee_min: 10
                    specialist_fee_max: 100
                    specialist_fee_step: 5
                    specialist_fee_range_display: $10–$100
                  summary: United States (location in New York)
                CountryWithoutPricingFallsBackToIndia:
                  value:
                    country_code: IN
                    country_name: India
                    detected_country_code: BR
                    source: default
                    is_fallback: true
                    currency: INR
                    currency_symbol: ₹
                    general_fee: 200
                    general_fee_display: ₹200
                    doctor_share_percent: 75
                    platform_fee_percent: 25
                    general_doctor_payout: '150.00'
                    general_doctor_payout_display: ₹150
                    specialist_fee_min: 200
                    specialist_fee_max: 2000
                    specialist_fee_step: 100
                    specialist_fee_range_display: ₹200–₹2,000
                  summary: Country without pricing falls back to India
          description: ''
        '400':
          description: Validation error. Body maps each invalid field to a list of
            messages, or has `detail`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
                  value:
                    non_field_errors:
                    - Send both lat and lng, or neither.
