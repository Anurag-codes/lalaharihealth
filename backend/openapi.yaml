                      starts_at: '2026-10-18T19:00:00+05:30'
                      date: '2026-10-18'
                      time_display: 07:00 PM
                      is_active: true
                      is_booked: false
                      appointment_id: null
          description: ''
        '400':
          description: Validation error. Body maps each invalid field to a list of
            messages, or has `detail`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Error:
